<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>声音自检</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;padding:18px;background:#12121a;color:#eee}
  h1{font-size:20px;margin:0 0 6px}
  .hint{font-size:13px;color:#9aa;margin:0 0 16px;line-height:1.6}
  button{display:block;width:100%;padding:16px;margin:0 0 12px;border:0;border-radius:12px;font-size:16px;font-weight:600;color:#fff;background:#4a7cff}
  button.alt{background:#7c4dff}
  button.alt2{background:#00a878}
  pre{background:#000;color:#8f8;padding:12px;border-radius:10px;font-size:12px;line-height:1.7;white-space:pre-wrap;word-break:break-all;min-height:180px}
</style>
</head>
<body>
<h1>声音自检</h1>
<p class="hint">请把这三个按钮都点一遍，然后把下面黑框里的内容截图发我。<br>如果第 ③ 个「嘀」也听不到，说明是手机音量 / 蓝牙耳机 / 浏览器站点静音的问题，跟网页代码无关。</p>
<button id="b1">① 播放词典音频（英文 hello）</button>
<button id="b2" class="alt">② 系统语音朗读（Hello, this is a test.）</button>
<button id="b3" class="alt2">③ 播放提示音（嘀）</button>
<pre id="log"></pre>
<script>
  var logEl = document.getElementById('log');
  var t0 = Date.now();
  function log(s) {
    logEl.textContent += '[+' + ((Date.now() - t0) / 1000).toFixed(2) + 's] ' + s + '\n';
  }

  log('UA: ' + navigator.userAgent);
  log('online: ' + navigator.onLine + ' / 触摸点: ' + (navigator.maxTouchPoints || 0));

  // ① 词典音频
  var a = null;
  document.getElementById('b1').onclick = function() {
    log('--- ① 词典音频 ---');
    try {
      if (!a) a = new Audio();
      a.onloadedmetadata = function() { log('loadedmetadata 时长=' + a.duration); };
      a.oncanplay = function() { log('canplay'); };
      a.onplaying = function() { log('playing（已交给系统播放）'); };
      a.onended = function() { log('ended（播完了）'); };
      a.onerror = function() { log('ERROR code=' + (a.error && a.error.code) + ' msg=' + (a.error && a.error.message)); };
      a.src = 'https://dict.youdao.com/dictvoice?type=2&audio=hello';
      a.volume = 1;
      a.muted = false;
      var p = a.play();
      if (p && p.then) {
        p.then(function() { log('play() 成功'); }).catch(function(e) { log('play() 被拒绝: ' + e.name + ' - ' + e.message); });
      }
      setTimeout(function() {
        log('1.2s 后: currentTime=' + a.currentTime.toFixed(2) + ' paused=' + a.paused +
            ' volume=' + a.volume + ' muted=' + a.muted + ' readyState=' + a.readyState);
      }, 1200);
      setTimeout(function() {
        log('3s 后: currentTime=' + a.currentTime.toFixed(2) + ' paused=' + a.paused + ' ended=' + a.ended);
      }, 3000);
    } catch (e) {
      log('异常: ' + e.message);
    }
  };

  // ② 系统语音
  document.getElementById('b2').onclick = function() {
    log('--- ② 系统语音 ---');
    if (!('speechSynthesis' in window)) { log('不支持 speechSynthesis'); return; }
    var s = window.speechSynthesis;
    var vs = s.getVoices() || [];
    log('语音数量=' + vs.length);
    vs.slice(0, 8).forEach(function(v) { log('  语音: ' + v.name + ' / ' + v.lang); });
    try {
      s.cancel();
      var u = new SpeechSynthesisUtterance('Hello, this is a test.');
      u.lang = 'en-US';
      u.rate = 0.95;
      u.onstart = function() { log('onstart（开始朗读）'); };
      u.onend = function() { log('onend（读完）'); };
      u.onerror = function(e) { log('onerror: ' + (e.error || e.name)); };
      s.speak(u);
      log('已调用 speak()');
      setTimeout(function() {
        log('1.5s 后: speaking=' + s.speaking + ' pending=' + s.pending + ' paused=' + s.paused);
      }, 1500);
    } catch (e) {
      log('异常: ' + e.message);
    }
  };

  // ③ WebAudio 提示音
  document.getElementById('b3').onclick = function() {
    log('--- ③ 提示音 ---');
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) { log('不支持 AudioContext'); return; }
      var ctx = new Ctx();
      log('AudioContext state=' + ctx.state + ' sampleRate=' + ctx.sampleRate);
      if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
      var osc = ctx.createOscillator();
      var g = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      g.gain.value = 0.35;
      osc.connect(g);
      g.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.9);
      log('已播放 0.9 秒 880Hz 提示音');
      setTimeout(function() { log('之后 state=' + ctx.state); }, 500);
    } catch (e) {
      log('异常: ' + e.message);
    }
  };
</script>
</body>
</html>
